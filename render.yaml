services:
  - type: web
    name: freelancer-hub-backend
    env: python
    region: singapore
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py migrate && python backend/manage.py seed_data"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
